# UCM for Allwinner H616 Codec
#
# Debian's alsa-ucm-conf copy plus ROCKNIX's H700 change: the codec comes up
# with the DAC switched off, so turn it on at every boot (alsactl restore runs
# FixedBootSequence).

Syntax 3

SectionUseCase."HiFi" {
	File "/Allwinner/sun4i-h616/HiFi.conf"
	Comment "Play HiFi quality Music"
}

FixedBootSequence [
	cset "name='DAC Playback Switch' on"
]
