# Debian's alsa-ucm-conf copy plus ROCKNIX's H700 change: put the digital DAC
# volume at its maximum and leave volume control to the "Line Out" element.

SectionDevice."Speaker" {
	Comment "Internal Speaker"

	EnableSequence [
		cset "name='DAC Playback Volume' 63"
		cset "name='Speaker Switch' on"
	]

	Value {
		PlaybackMixerElem "Line Out"
		PlaybackPCM "hw:${CardId},0"
	}

	DisableSequence [
		cset "name='Speaker Switch' off"
	]

	ConflictingDevice [
		"Headphones"
	]
}


SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='DAC Playback Volume' 63"
	]

	Value {
		PlaybackMixerElem "Line Out"
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
	}

	ConflictingDevice [
		"Speaker"
	]
}
