name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      lpddr3:
        description: Also build the LPDDR3 (2026 board revision) disk image
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Native arm64: nothing is emulated, and the kernel/U-Boot "cross" stages
    # just use the native compiler.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set image names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=localhost/rg35xxsp-bootc:latest" >> "$GITHUB_ENV"
          echo "TARGET_IMGREF=ghcr.io/${owner}/rg35xxsp-bootc:latest" >> "$GITHUB_ENV"

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Build image
        run: just build

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push "$IMAGE" "docker://$TARGET_IMGREF"

      # One artifact per RAM variant so each downloads on its own. LPDDR3 is
      # only built on request (Run workflow -> lpddr3) while testing on LPDDR4.
      - name: Build LPDDR4 disk image
        run: |
          just disk-image lpddr4 3G
          zstd -T0 -10 --rm output/rg35xxsp.img -o output/rg35xxsp-lpddr4.img.zst

      - uses: actions/upload-artifact@v4
        with:
          name: rg35xxsp-lpddr4
          path: output/rg35xxsp-lpddr4.img.zst
          compression-level: 0

      - name: Build LPDDR3 disk image
        if: inputs.lpddr3
        run: |
          just disk-image lpddr3 3G
          zstd -T0 -10 --rm output/rg35xxsp.img -o output/rg35xxsp-lpddr3.img.zst

      - uses: actions/upload-artifact@v4
        if: inputs.lpddr3
        with:
          name: rg35xxsp-lpddr3
          path: output/rg35xxsp-lpddr3.img.zst
          compression-level: 0
